[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "glyphshift"
version = "0.1.0"
description = "Lossless, cross-platform font converter (TTF/OTF/WOFF/WOFF2) with automatic verification"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Saeed shamsi", email = "saeedshams2024@gmail.com" },
]
keywords = [
    "font",
    "converter",
    "ttf",
    "otf",
    "woff",
    "woff2",
    "opentype",
    "persian",
    "arabic",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Fonts",
    "Typing :: Typed",
]
dependencies = [
    "fonttools>=4.40",
    "brotli>=1.0.9",
    "click>=8.0",
    "platformdirs>=3.0",
]

[project.optional-dependencies]
gui = [
    "PySide6>=6.5",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "pyinstaller>=6.0",
    "PySide6>=6.5",
]

[project.urls]
Homepage = "https://github.com/SaeedShamsi/GlyphShift"
Repository = "https://github.com/SaeedShamsi/GlyphShift"
Issues = "https://github.com/SaeedShamsi/GlyphShift/issues"

[project.scripts]
glyphshift = "glyphshift.cli:main"

[project.gui-scripts]
glyphshift-gui = "glyphshift.gui.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/glyphshift"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py39"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "B",
    "UP",
    "SIM",
    "RUF",
]
ignore = [
    "E501",
    # Intentional Persian/Arabic UI and sample strings.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.coverage.run]
source = ["glyphshift"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
